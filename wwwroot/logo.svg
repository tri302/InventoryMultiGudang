<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="indigoPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    
    <linearGradient id="emeraldPrimary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="#FFFFFF" rx="24"/>

  <!-- Logo Mark -->
  <g transform="translate(250, 170)">
    <!-- Outer Hexagon Segment 1 (Indigo) -->
    <path d="M 0,-80 L 69,-40 L 69,20 L 39,3" fill="none" stroke="url(#indigoPrimary)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Outer Hexagon Segment 2 (Emerald Arrow) -->
    <path d="M 69,40 L 0,80 L -69,40 L -69,-40 L -39,-23" fill="none" stroke="url(#emeraldPrimary)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Center Box / Inventory Core -->
    <polygon points="0,-25 22,-12 22,12 0,25 -22,12 -22,-12" fill="url(#emeraldPrimary)" />
    
    <!-- Connecting Dots -->
    <circle cx="0" cy="-80" r="6" fill="#059669" />
    <circle cx="0" cy="80" r="6" fill="#1E293B" />
  </g>

  <!-- Typography -->
  <text x="250" y="325" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="800" font-size="32" fill="#1E293B" text-anchor="middle" letter-spacing="3">
    NEXUS<tspan fill="#059669">FLOW</tspan>
  </text>
  
  <text x="250" y="355" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="500" font-size="11" fill="#64748B" text-anchor="middle" letter-spacing="5">
    INVENTORY MANAGEMENT
  </text>
</svg>
